# /etc/nginx/sites-available/course.jiucheng-zang.ca
# Symlink into sites-enabled/, then `certbot --nginx -d course.jiucheng-zang.ca`
# will fill in the listen 443 / ssl_certificate lines automatically.
# Mirrors the existing beanbookapp.conf reverse-proxy pattern.

upstream uwcourse_upstream {
    server 127.0.0.1:31415;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name course.jiucheng-zang.ca;

    location / {
        proxy_pass http://uwcourse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
